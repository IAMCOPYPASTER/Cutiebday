<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Special Message 💫</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <canvas class="canvas-bg"></canvas>
    <canvas class="canvas-fx"></canvas>

    <div class="stage">

        <header class="hdr">
            <div class="brand">
                <div class="logo">🎉</div>
                <div>
                    <h1>Happy Birthday, Riddhi!</h1>
                    <p class="sub">A little something just for you</p>
                </div>
            </div>
            <div class="controls">
                <button class="btn ghost small">Music: On</button>
            </div>
        </header>

        <main class="main">
            <div class="center-stage">

                <div class="gift-wrap">
                    <div class="gift-css">
                        <div class="box-top"></div>
                        <div class="box-body"></div>
                        <div class="ribbon"></div>
                    </div>
                    <div class="click-hint">Click to open</div>
                </div>

                <div class="message-card hidden">
                    <div class="typed"></div>
                </div>

                <div class="slideshow hidden">
                    <div class="slide-view">
                        <img src="assets/pic1.jpg" alt="Slideshow Image">
                    </div>
                    <div class="thumbs">
                        <img src="assets/pic1.jpg" alt="Thumb 1">
                        <img src="assets/pic2.jpg" alt="Thumb 2">
                        <img src="assets/pic3.jpg" alt="Thumb 3">
                        <img src="assets/pic4.jpg" alt="Thumb 4">
                        <img src="assets/pic5.jpg" alt="Thumb 5">
                    </div>
                </div>

            </div>
        </main>

        <footer class="ftr">
            <p class="small-note">Made with 💖 by Tanishq</p>
        </footer>

    </div>

    <script src="script.js"></script>
</body>
</html>
